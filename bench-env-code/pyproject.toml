[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-env-code"
version = "0.1.0"
description = "Benchmark runner for LeanEGBench experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115.0",
    "leanclient>=0.9.4",
	"anthropic>=0.50.0",
    "openai>=2.32.0",
	"uvicorn>=0.30.0",
]

[project.scripts]
bench-env-runner = "runner.main:main"

[tool.setuptools]
packages = ["runner"]
